<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>a Dropdown-based Selection Page:</title>
</head>
<body>
    <h1>Plan your Selection Page</h1>
    <form>
    <label for="country">Country:</label>
    <select name="country" id="country">
        <option>Select Country </option>
    <option >India</option>
    <option >Japan</option>
    <option>Frnach</option>
    </select>
    <br><br>
    <label for="state">State:</label>
    <select name="state" id="state">
        <option>Select State</option>
         <option>Uttrakhand</option>
        <option>Jammu </option>
         <option>Jaipur</option>

    </select>
     <label for="city">City:</label>
    <select id="city" name="city">
      <option selected>Dehradun</option>
      <option>Jaipur</option>
      <option>Mumbai</option>
      <option>Kochi</option>
    </select>
    <br><br>

    <label for="place">Favorite Tourist Place:</label>
    <select id="place" name="place">
      <option selected>Mussoorie</option>
      <option>Mount Fuji</option>
      <option>Eiffel Tower</option>
      <option>Christ the Redeemer</option>
    </select>
  </form>
  <p>
     You have selected <strong>India</strong>, <strong>Uttarakhand</strong>, <strong>Dehradun</strong> as your location, and your favorite tourist place is <strong>Mussoorie</strong>.

  </p>

</body>
</html>
