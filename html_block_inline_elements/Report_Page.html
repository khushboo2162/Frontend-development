<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Report Page </title>
</head>
<body>
    <h1>Agrawal's High School</h1>
    <table border="1" cellpadding="10">
        <thead>
      <tr>
        <th rowspan="2">Subject</th>
        <th colspan="2">Marks</th>
      </tr>
      <tr>
        <th title="Marks obtained by the student">Obtained</th>
        <th title="Maximum marks for the subject">Out of</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td title="English Language and Literature">English</td>
        <td>85</td>
        <td>100</td>
      </tr>
      <tr>
        <td title="Mathematics">Math</td>
        <td>90</td>
        <td>100</td>
      </tr>
      <tr>
        <td title="Science (Physics, Chemistry, Biology)">Science</td>
        <td>88</td>
        <td>100</td>
      </tr>
      <tr>
        <td title="Social Studies">Social Science</td>
        <td>82</td>
        <td>100</td>
      </tr>
      <tr>
        <td title="Second Language - Hindi">Hindi</td>
        <td>87</td>
        <td>100</td>
      </tr>
      <tr>
        <td colspan="1"><strong>Total</strong></td>
        <td colspan="2">432 / 500</td>
      </tr>
      <tr>
        <td colspan="1"><strong>Percentage</strong></td>
        <td colspan="2">86.4%</td>
      </tr>
    </tbody>

             


    </table>
</body>
</html>
