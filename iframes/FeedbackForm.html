<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback form </title>
</head>
<body>
    <h1>Feedback Form</h1>
    <form action="#" method ="post">
        <label for="textarea">Your Feedback</label>
        <textarea id="textarea"  name="textarea" row="3" cols="40"></textarea>
        <br><br><br>
        <label >Rating:</label>
        <br>
        <input type="radio" name="rating" value="Good " id="good">
        <label for="good">Good</label>
        <input type="radio" name="rating" value="Average" id="average">
        <label for="average">Average</label>
        <input type="radio"  name="rating" id="bad" value="Bad">
        <label for="bad">Bad</label>
        <br><br><br>
        <button type="submit">Submit</button>
    </form>

</body>
</html>
