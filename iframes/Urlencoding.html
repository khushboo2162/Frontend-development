<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="author" content="Khushboo">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>URI Encoding Example</title>
</head>
<body>
  <h2>URI Encoding Demo</h2>

  <!-- Original URL with special characters (not safe for direct use) -->
  <!-- https://example.com/search?query=HTML & CSS -->

  <!-- Encoded version using %20 for space and %26 for & -->
  <a href="https://example.com/search?query=HTML%20%26%20CSS">
    Search for "HTML & CSS"
  </a>

  <p>
    This link demonstrates URI encoding. Special characters like spaces and ampersands must be encoded to ensure the URL works correctly. For example:
    <br>
    <strong>Space</strong> → <code>%20</code><br>
    <strong>&amp;</strong> → <code>%26</code>
  </p>
</body>
</html>
